name: Deploy AI-Verse to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Required AI-Verse files are present."

      - name: Prepare the single hero mecha with Blender
        shell: bash
        run: |
          set -u
          mkdir -p models
          SOURCE="$RUNNER_TEMP/atlas-09-source.glb"
          if curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            "https://ramonlinares.github.io/atlas-09/models/atlas-09.glb" -o "$SOURCE"; then
            sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
            if blender -b --python blender/prepare_hero_mech.py -- "$SOURCE" "$GITHUB_WORKSPACE/models/hero-mech.glb" && test -s "$GITHUB_WORKSPACE/models/hero-mech.glb"; then
              echo "Blender prepared the hero mecha GLB."
            else
              echo "::warning::Blender processing failed or produced no output; deploying the original CC0 GLB instead."
              cp "$SOURCE" models/hero-mech.glb
            fi
            test -s models/hero-mech.glb
            ls -lh models/hero-mech.glb
          else
            echo "::warning::Could not download the CC0 source model; the website will try its hosted fallback URL."
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
